name: build-releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release version: $version"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 构建前端
        working-directory: frontend
        run: |
          $env:VITE_APP_VERSION = $env:APP_VERSION
          $env:VITE_GITHUB_OWNER = 'wang66676'
          $env:VITE_GITHUB_REPO = 'ivs-inventory-system'
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建单 JAR 并运行测试
        run: mvn -B -f backend/pom.xml package

      - name: jpackage 生成带 Java 运行时的电脑程序
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\jpackage-input | Out-Null
          Copy-Item backend\app\target\ivs-app-0.1.0-SNAPSHOT.jar build\jpackage-input\ivs-app.jar
          jpackage --type app-image --name IVS --app-version $env:APP_VERSION `
            --input build\jpackage-input --main-jar ivs-app.jar `
            --main-class org.springframework.boot.loader.launch.JarLauncher `
            --dest windows-app --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Divs.desktop.open-browser=true" --add-modules ALL-MODULE-PATH

      - name: Inno Setup 生成 Windows 安装包
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          & $iscc "packaging\windows\setup.iss"

      - name: 生成绿色免安装版
        shell: pwsh
        run: Compress-Archive -Path windows-app\IVS\* -DestinationPath "windows-app\IVS-Portable-$env:APP_VERSION.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist-setup/IVS-Setup-*.exe
            windows-app/IVS-Portable-*.zip
            packaging/web/网页登录版.url

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.0.0"; fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1); MINOR=$(echo "$VERSION" | cut -d. -f2); PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          if [[ -z "$SDKMANAGER" ]]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 Android APK
        working-directory: android-app
        env:
          IVS_SERVER_URL: ${{ vars.IVS_SERVER_URL || 'https://radio-together-placed-facilitate.trycloudflare.com/' }}
        run: gradle assembleRelease --no-daemon

      - name: 整理 APK
        shell: bash
        run: |
          mkdir -p release-assets
          cp android-app/app/build/outputs/apk/release/app-release.apk "release-assets/IVS-Android-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 生成 SHA256 校验文件
        shell: bash
        run: |
          mkdir -p release-flat
          find release-assets -type f -exec cp {} release-flat/ \;
          cd release-flat
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-flat/*
          generate_release_notes: true
          name: IVS 进销存系统 ${{ github.ref_name }}
          overwrite_files: true
          make_latest: true
