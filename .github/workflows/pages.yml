name: deploy-web-login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 构建网页登录版
        working-directory: frontend
        env:
          VITE_BASE_PATH: /ivs-inventory-system/
          VITE_ROUTER_MODE: hash
          VITE_API_BASE_URL: ${{ vars.IVS_API_BASE_URL || 'https://radio-together-placed-facilitate.trycloudflare.com/api' }}
          VITE_LIVE_API_CONFIG: 'true'
          VITE_APP_VERSION: 1.0.8
          VITE_GITHUB_OWNER: wang66676
          VITE_GITHUB_REPO: ivs-inventory-system
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          cp dist/index.html dist/404.html
          node -e "const fs=require('fs');fs.writeFileSync('dist/public-api.json',JSON.stringify({apiBaseUrl:process.env.VITE_API_BASE_URL,updatedAt:new Date().toISOString()}))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
