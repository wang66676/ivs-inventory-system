server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: ivs
  datasource:
    # 默认使用 H2（PostgreSQL 兼容模式）文件库，零依赖即可启动；
    # 生产切换 PostgreSQL：DB_URL/DB_DRIVER/DB_USERNAME/DB_PASSWORD
    url: ${DB_URL:jdbc:h2:file:./data/ivs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ivs:
  version: ${IVS_VERSION:1.9.18}
  invoice:
    storage-dir: ${IVS_INVOICE_STORAGE_DIR:./data/invoice-files}
  cors:
    allowed-origins: ${IVS_CORS_ALLOWED_ORIGINS:http://localhost:8090,http://localhost:5174,https://wang66676.github.io}
  desktop:
    open-browser: ${IVS_OPEN_BROWSER:false}
  security:
    session-hours: 12
    # 引导管理员：生产环境请用环境变量设置强密码，或首次登录后立即修改
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
  backup:
    enabled: ${IVS_BACKUP_ENABLED:true}
    dir: ${IVS_BACKUP_DIR:./backups}
    cron: "${IVS_BACKUP_CRON:0 30 2 * * *}"
    retention-days: ${IVS_BACKUP_RETENTION_DAYS:30}
  health:
    initial-delay-ms: ${IVS_HEALTH_INITIAL_DELAY_MS:60000}
    check-interval-ms: ${IVS_HEALTH_CHECK_INTERVAL_MS:900000}
    backup-max-age-hours: ${IVS_BACKUP_MAX_AGE_HOURS:36}
    min-free-mb: ${IVS_MIN_FREE_MB:1024}
  audit:
    cleanup-enabled: ${IVS_AUDIT_CLEANUP_ENABLED:true}
    retention-days: ${IVS_AUDIT_RETENTION_DAYS:730}
    cleanup-cron: "${IVS_AUDIT_CLEANUP_CRON:0 10 3 * * *}"
  outbox:
    dispatch-enabled: true
    dispatch-interval-ms: 3000
  lease:
    billing-automation:
      enabled: ${IVS_LEASE_BILLING_ENABLED:true}
      interval-ms: ${IVS_LEASE_BILLING_INTERVAL_MS:3600000}
      reminder-days: ${IVS_LEASE_REMINDER_DAYS:7}
    depreciation:
      months: ${IVS_LEASE_DEPRECIATION_MONTHS:60}

info:
  app:
    name: IVS 进销存系统
    version: ${ivs.version}
