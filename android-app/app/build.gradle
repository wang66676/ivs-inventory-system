plugins { id 'com.android.application' }

def appVersionName = System.getenv('APP_VERSION') ?: '1.9.9'
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '10909') as Integer
def serverUrl = System.getenv('IVS_SERVER_URL') ?: 'https://mailto-drum-seeker-darwin.trycloudflare.com/'

android {
    namespace 'com.ivs.inventory'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ivs.inventory'
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + serverUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
